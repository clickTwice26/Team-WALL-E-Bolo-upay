# nginx site for a host that already runs nginx on 80/443 behind Cloudflare.
# Used instead of the Caddy service: start only the app container, published
# on 127.0.0.1:28620 by a local docker-compose.override.yml:
#
#   services:
#     app:
#       ports: ["127.0.0.1:28620:8000"]
#
#   docker compose up -d --build app
#   sudo cp deploy/nginx-boloupay.shagato.space.conf /etc/nginx/sites-available/boloupay.shagato.space
#   sudo ln -s /etc/nginx/sites-available/boloupay.shagato.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d boloupay.shagato.space     # adds the 443 server block
#
# HTTPS is required end to end: browsers block the microphone on plain http.

server {
    listen 80;
    listen [::]:80;
    server_name boloupay.shagato.space;

    # Real visitor IPs from Cloudflare (https://www.cloudflare.com/ips/)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:28620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
