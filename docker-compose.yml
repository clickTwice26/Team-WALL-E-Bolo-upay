# Usage (from the repo root):
#   cp .env.example .env   # set DOMAIN and (optionally) the LLM key
#   docker compose up -d --build
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - bolo-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  bolo-data:
  caddy-data:
  caddy-config:
